name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Tests
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python Rich
        run: python3 -m pip install --upgrade pip && python3 -m pip install "rich==14.3.2"
      - name: Parity tests
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          bash tests/parity/run_parity.sh phase1
          bash tests/parity/run_parity.sh phase2
          bash tests/parity/run_parity.sh phase3
          bash tests/parity/run_parity.sh phase4
          bash tests/parity/run_parity.sh phase5

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Package (dry run)
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo package

  # Build the C/C++ FFI artifacts (librich_ffi static + shared libs + headers)
  # for each platform/arch on a NATIVE runner. Native runners avoid cross-compiling
  # the vendored oniguruma C (onig_sys) — each runner has its own C toolchain.
  ffi-build:
    name: ffi (${{ matrix.target }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # macOS arm64 only. macos-13 (the last native Intel runner) is retiring
          # (github.blog 2025-09-19); x86_64-apple-darwin is still cross-compilable
          # on the arm64 runners, but Intel Macs are a shrinking minority — dropped
          # as not worth the extra leg (re-add an x86_64 cross-build if ever needed).
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2022 }
          - { target: aarch64-pc-windows-msvc,   os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static + shared libraries
        run: cargo build --release --manifest-path ffi/Cargo.toml --target ${{ matrix.target }}
      - name: Package (include/ + lib/ + headers)
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rich-ffi-${version}-${{ matrix.target }}"
          out="ffi/target/${{ matrix.target }}/release"
          mkdir -p "pkg/${name}/include" "pkg/${name}/lib"
          cp ffi/include/rich.h ffi/include/rich.hpp "pkg/${name}/include/"
          # Copy whichever library artifacts this platform produced.
          for f in librich_ffi.a librich_ffi.so librich_ffi.dylib \
                   rich_ffi.lib rich_ffi.dll rich_ffi.dll.lib; do
            if [ -f "${out}/${f}" ]; then cp "${out}/${f}" "pkg/${name}/lib/"; fi
          done
          cp LICENSE "pkg/${name}/" 2>/dev/null || true
          tar -C pkg -czf "${name}.tar.gz" "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "--- packaged ${name}.tar.gz ---"
          tar -tzf "${name}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.name }}.tar.gz
          if-no-files-found: error

  zig-package:
    name: Zig source package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package Zig source projection
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rich-zig-${version}"
          root="pkg/${name}"
          grep -Fq ".version = \"${version}\"" bindings/zig/build.zig.zon
          mkdir -p "${root}/include"
          cp bindings/zig/build.zig bindings/zig/build.zig.zon \
             bindings/zig/README.md "${root}/"
          cp -R bindings/zig/src bindings/zig/examples "${root}/"
          cp ffi/include/rich.h "${root}/include/"
          cp LICENSE "${root}/"
          tar -C pkg -czf "${name}.tar.gz" "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          tar -tzf "${name}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: zig-source
          path: ${{ steps.pkg.outputs.name }}.tar.gz
          if-no-files-found: error

  go-package:
    name: Go source package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
      - name: Package Go source projection
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="$(mktemp -d)"
          bindings/go/package-release.sh "$version" "$output"
          name="rich-go-${version}"
          cp "$output/${name}.tar.gz" .
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          tar -tzf "${name}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: go-source
          path: ${{ steps.pkg.outputs.name }}.tar.gz
          if-no-files-found: error

  csharp-package:
    name: C# NuGet package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: bindings/csharp/**/packages.lock.json
      - name: Build native and managed libraries
        run: |
          cargo build --release --manifest-path ffi/Cargo.toml
          dotnet restore bindings/csharp/RichRs.sln --locked-mode
          dotnet build bindings/csharp/RichRs.sln --configuration Release --no-restore
      - name: Package managed projection
        id: pkg
        env:
          RICH_RS_NATIVE_LIBRARY: ${{ github.workspace }}/ffi/target/release/librich_ffi.so
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="$(mktemp -d)"
          bindings/csharp/package-release.sh "$version" "$output"
          name="RichRs.Native.${version}.nupkg"
          cp "$output/$name" .
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -Z1 "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: csharp-package
          path: ${{ steps.pkg.outputs.name }}
          if-no-files-found: error

  node-package:
    name: Node source package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Build native FFI
        run: cargo build --release --manifest-path ffi/Cargo.toml
      - name: Package Node source projection
        id: pkg
        env:
          RICH_FFI_STATIC: ${{ github.workspace }}/ffi/target/release/librich_ffi.a
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="$(mktemp -d)"
          bindings/node/package-release.sh "$version" "$output"
          name="rich-rs-native-${version}.tgz"
          cp "$output/$name" .
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tar -tzf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: node-source
          path: ${{ steps.pkg.outputs.name }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Gate crate publish on ALL ffi-build arches succeeding: a release is
    # atomic — if any platform's library fails to build, we publish nothing
    # (no crates.io upload, no GitHub Release).
    needs: [test, parity, package, ffi-build, zig-package, go-package, csharp-package, node-package]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Read crate version
        id: crate_version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check if version exists on crates.io
        id: version_check
        run: |
          set -euo pipefail
          crate_name=$(cargo metadata --no-deps --format-version 1 | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['name'])")
          version="${{ steps.crate_version.outputs.version }}"
          if curl -sfL "https://crates.io/api/v1/crates/${crate_name}/${version}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip publish (version exists)
        if: steps.version_check.outputs.exists == 'true'
        run: echo "crate version already published; skipping cargo publish"
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        if: steps.version_check.outputs.exists != 'true'
      - name: Publish to crates.io
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
        if: steps.version_check.outputs.exists != 'true'

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [test, parity, package, publish, ffi-build, zig-package, go-package, csharp-package, node-package]
    steps:
      - uses: actions/checkout@v7
      - name: Download FFI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          path: dist
          merge-multiple: true
      - name: Download Zig source artifact
        uses: actions/download-artifact@v8
        with:
          name: zig-source
          path: dist
      - name: Download Go source artifact
        uses: actions/download-artifact@v8
        with:
          name: go-source
          path: dist
      - name: Download C# package artifact
        uses: actions/download-artifact@v8
        with:
          name: csharp-package
          path: dist
      - name: Download Node source artifact
        uses: actions/download-artifact@v8
        with:
          name: node-source
          path: dist
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.nupkg *.tgz | tee SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.nupkg
            dist/*.tgz
            dist/SHA256SUMS
