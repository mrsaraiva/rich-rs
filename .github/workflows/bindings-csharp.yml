name: C# bindings

on:
  push:
    paths:
      - "bindings/csharp/**"
      - "ffi/**"
      - "examples/demo.rs"
      - "tests/demo-parity/**"
      - "tests/golden/demo-120-truecolor.ansi"
      - "docs/devel/BINDINGS_DEMO_PARITY_SPEC.md"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bindings-csharp.yml"
  pull_request:
    paths:
      - "bindings/csharp/**"
      - "ffi/**"
      - "examples/demo.rs"
      - "tests/demo-parity/**"
      - "tests/golden/demo-120-truecolor.ansi"
      - "docs/devel/BINDINGS_DEMO_PARITY_SPEC.md"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bindings-csharp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: bindings/csharp/**/packages.lock.json
      - name: Build native library
        run: cargo build --release --manifest-path ffi/Cargo.toml --features parity-trace
      - name: Verify canonical demo sources
        run: bash tests/demo-parity/check-sources.sh
      - name: Restore managed dependencies
        run: dotnet restore bindings/csharp/RichRs.sln --locked-mode
      - name: Verify managed formatting
        run: dotnet format bindings/csharp/RichRs.sln --verify-no-changes --no-restore
      - name: Build managed projects
        run: dotnet build bindings/csharp/RichRs.sln --configuration Release --no-restore
      - name: Test managed bindings
        env:
          RICH_RS_NATIVE_LIBRARY: ${{ github.workspace }}/ffi/target/release/librich_ffi.so
        run: dotnet test bindings/csharp/RichRs.sln --configuration Release --no-build --no-restore
      - name: Run and compare canonical demo
        env:
          RICH_RS_NATIVE_LIBRARY: ${{ github.workspace }}/ffi/target/release/librich_ffi.so
          RICH_FFI_PARITY_TRACE: ${{ runner.temp }}/csharp-parity.trace
        run: |
          bindings/csharp/examples/RichRs.Demo/bin/Release/net10.0/RichRs.Demo --parity \
            > "$RUNNER_TEMP/csharp-parity.ansi"
          python3 tests/demo-parity/normalize.py \
            "$RUNNER_TEMP/csharp-parity.ansi" "$RUNNER_TEMP/csharp-parity.normalized.ansi"
          cmp tests/golden/demo-120-truecolor.ansi "$RUNNER_TEMP/csharp-parity.normalized.ansi"
          python3 - "$RICH_FFI_PARITY_TRACE" <<'PY'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          required = {"table_grid", "table_none", "table_pad_edge", "table_row_styles",
                      "table_column_options", "syntax_indent_guides", "pretty_new", "pretty_finish",
                      "custom_new", "custom_measure", "custom_render", "sink_push", "sink_line"}
          names = [event["event"] for event in events]
          missing = sorted(required - set(names))
          drops = names.count("custom_drop")
          if missing or drops != 1:
              raise SystemExit(f"invalid C# parity trace: missing={missing}, custom_drop={drops}")
          PY
      - name: Pack and inspect NuGet artifact
        env:
          RICH_RS_NATIVE_LIBRARY: ${{ github.workspace }}/ffi/target/release/librich_ffi.so
        run: bindings/csharp/package-release.sh 1.2.2 "$RUNNER_TEMP/rich-csharp-package"
      - uses: actions/upload-artifact@v7
        with:
          name: rich-csharp-nuget
          path: ${{ runner.temp }}/rich-csharp-package/RichRs.Native.1.2.2.nupkg
          if-no-files-found: error
