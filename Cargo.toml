[package]
name = "rich-rs"
version = "0.1.0"
edition = "2024"
description = "Rich text and beautiful formatting for the terminal"
license = "MIT"
keywords = ["terminal", "console", "ansi", "color", "formatting"]
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
atty = "0.2"
smallvec = "1.13"
thiserror = "2.0"
once_cell = "1.19"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig", "plist-load"] }
pulldown-cmark = "0.12"

[dev-dependencies]
