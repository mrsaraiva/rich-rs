[package]
name = "rich-rs"
version = "1.1.1"
edition = "2024"
rust-version = "1.85.0"
description = "Rich text and beautiful formatting for the terminal"
license = "MIT"
keywords = ["terminal", "console", "ansi", "color", "formatting"]
categories = ["command-line-interface"]
repository = "https://github.com/mrsaraiva/rich-rs"
documentation = "https://docs.rs/rich-rs"
readme = "README.md"
exclude = [
    ".idea/",
    "*.dat",
    "docs/devel/",
    "tests/parity/",
    "tools/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
atty = "0.2"
smallvec = "1.13"
thiserror = "2.0"
once_cell = "1.19"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig", "plist-load"] }
pulldown-cmark = "0.12"

[dev-dependencies]
rand = "0.9.2"
ureq = "3"
ctrlc = "3"
serde_json = "1"
