[package]
name = "pygments-theme-import"
version = "0.1.0"
edition = "2021"
description = "Convert Pygments themes to TextMate .tmTheme format"

[[bin]]
name = "pygments-to-tmtheme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
