[package]
name = "rich-tracing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Tracing/log adapters that render events through rich-rs Console"
license = "MIT"
repository = "https://github.com/mrsaraiva/rich-rs"
readme = "README.md"
keywords = ["rich", "tracing", "log", "terminal", "console"]
categories = ["development-tools::debugging"]

[features]
default = ["tracing", "log"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
log = ["dep:log"]

[dependencies]
rich-rs = { path = "../.." }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "registry"] }
log = { version = "0.4", optional = true }

[[example]]
name = "tracing_basic"
required-features = ["tracing"]
