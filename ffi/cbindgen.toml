# cbindgen configuration — generates include/rich.h from the Rust ABI.
language = "C"
include_guard = "RICH_FFI_H"
autogen_warning = "/* Generated by cbindgen from rich-ffi. DO NOT EDIT BY HAND. */"
# Emit `extern "C"` guards + pull in <stdbool.h>/<stdint.h> so the same header
# compiles cleanly from both C and C++ translation units.
cpp_compat = true
style = "type"
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false

[export]
prefix = ""
