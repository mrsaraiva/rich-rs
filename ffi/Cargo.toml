[package]
name = "rich-ffi"
version = "1.2.2"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Stable native ABI foundation for rich-rs language bindings"
publish = false

[lib]
# `rich_ffi` is the symbol/library base name: librich_ffi.a / .so, rich_ffi.lib / .dll
name = "rich_ffi"
# staticlib  -> librich_ffi.a / rich_ffi.lib  (link straight into the C++ binary; preferred)
# cdylib     -> librich_ffi.so / .dylib / rich_ffi.dll (offered for flexibility)
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Crate name is `rich-rs`; imported in code as `rich_rs`.
rich-rs = { path = ".." }

# Used only to VALIDATE JSON input in `rich_json_new` (parse-and-discard).
serde_json = "1"

# 0.28+ is required: it understands the edition-2024 `#[unsafe(no_mangle)]`
# attribute. Older cbindgen silently emits an empty header.
[build-dependencies]
cbindgen = "0.29"

# NOTE on panic strategy: keep the default `unwind` and contain every ABI operation
# with `catch_unwind`. Fallible calls map a caught Rust panic to the distinct
# `RICH_ERROR_PANIC` result after neutralizing outputs; NULL-safe destructors contain
# and discard panics. We do not use `panic = "abort"`, because that would terminate a
# foreign host instead of reporting the boundary failure.
